name: Publish browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: browser-build
      - name: Unpack the tested build for this revision
        run: |
          test "$(cat browser-build/build-sha.txt)" = "$GITHUB_SHA"
          mkdir -p dist
          tar -xzf browser-build/browser-build.tar.gz -C dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Check that this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded revision $GITHUB_SHA; main is $latest_sha." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
  deploy_cloudflare:
    if: vars.CLOUDFLARE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-workers
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: browser-build
      - name: Unpack the tested build for this revision
        run: |
          test "$(cat browser-build/build-sha.txt)" = "$GITHUB_SHA"
          mkdir -p dist
          tar -xzf browser-build/browser-build.tar.gz -C dist
      - name: Check that this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded revision $GITHUB_SHA; main is $latest_sha." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: cloudflare/wrangler-action@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
