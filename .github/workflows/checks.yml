name: Game checks
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m unittest discover -v
      - run: npm ci --ignore-scripts
      - run: npm test
  build:
    name: Build browser artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/build_web.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Package the build with its source revision
        run: |
          tar -C dist -czf browser-build.tar.gz .
          echo "$GITHUB_SHA" > build-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: |
            browser-build.tar.gz
            build-sha.txt
          overwrite: true
          retention-days: 7
  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: browser-build
      - name: Unpack the build for this revision
        run: |
          test "$(cat browser-build/build-sha.txt)" = "$GITHUB_SHA"
          mkdir -p dist
          tar -xzf browser-build/browser-build.tar.gz -C dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:built -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.shard }}
          path: blob-report/
          overwrite: true
          retention-days: 7
  report:
    name: Combined browser report
    needs: browser
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-report-*
          path: browser-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html browser-reports
      - uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: playwright-report/
          overwrite: true
          retention-days: 7
