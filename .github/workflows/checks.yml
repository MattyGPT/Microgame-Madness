name: Game checks
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m unittest discover -v
      - run: npm ci --ignore-scripts
      - run: npm test
  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=2 --fully-parallel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
